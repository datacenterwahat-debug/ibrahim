<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#152d35">
<title>Ibrahim Ahmed | Linah Farms</title>
<style>
:root{
  --navy:#152d35;
  --green:#426d59;
  --sage:#dce8df;
  --cream:#f7f5ef;
  --ink:#182a3d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(145deg,#e8eee9 0%,#f7f5ef 45%,#e7ece8 100%);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  padding:20px 12px;
  min-height:100vh;
}
main{max-width:400px;margin:0 auto}
.card{
  background:var(--cream);
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 20px 55px #102b3020;
  border:1px solid #d5e0d8;
}
.hero{
  background:linear-gradient(165deg, var(--navy) 0%, #1a3540 50%, #2d5648 100%);
  padding:32px 20px 38px;
  text-align:center;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  left:-10%;right:-10%;
  bottom:-2px;
  height:34px;
  background:var(--cream);
  border-radius:50% 50% 0 0;
}
.photo-wrap{
  width:150px;
  height:150px;
  margin:0 auto 16px;
  border-radius:50%;
  padding:5px;
  background:linear-gradient(135deg,#ffffffdd,#c8dccf);
  box-shadow:0 10px 28px #00000040;
  position:relative;
  z-index:2;
}
.photo-wrap img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  object-position:center 25%;
  display:block;
  border:3px solid #fff;
}
.logo{
  letter-spacing:.3em;
  font-weight:700;
  font-size:12px;
  color:#dce8df;
  position:relative;
  z-index:2;
}
.content{
  padding:6px 22px 28px;
  text-align:center;
}
h1{
  font-size:clamp(21px,5.8vw,26px);
  margin:0 0 8px;
  color:var(--navy);
  font-weight:700;
  letter-spacing:-0.02em;
}
.role{
  font-size:clamp(13px,3.4vw,15px);
  line-height:1.45;
  color:var(--green);
  margin:0 auto 22px;
  max-width:300px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
a.action{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-decoration:none;
  border-radius:12px;
  padding:11px 8px;
  font-weight:700;
  font-size:13.5px;
  border:1px solid #c5d6cb;
  color:var(--navy);
  background:#fff;
}
a.primary{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}
a.whatsapp{
  background:#25D366;
  color:#fff;
  border-color:#1da851;
  grid-column:1 / -1;
}
a.save{
  grid-column:1 / -1;
  background:#fff;
  color:var(--navy);
}
.note{
  font-size:11.5px;
  line-height:1.45;
  color:#6a7c72;
  margin:16px auto 0;
  max-width:280px;
}
@media(max-width:340px){
  .actions{grid-template-columns:1fr}
  a.whatsapp, a.save{grid-column:auto}
}
</style>
</head>
